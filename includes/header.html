<script>
(function initNavigation() {
  const navToggle = document.getElementById('nav-toggle');
  const nav = document.getElementById('main-nav');

  if (navToggle && nav) {
    // Mobile menu toggle
    navToggle.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const isOpen = nav.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', isOpen);

      // Close all dropdowns when toggling menu
      nav.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('active'));

      if (isOpen) {
        document.body.classList.add('nav-open');
      } else {
        document.body.classList.remove('nav-open');
      }
    });

    // Close menu on resize to desktop
    window.addEventListener('resize', function() {
      if (window.innerWidth > 768 && nav.classList.contains('open')) {
        nav.classList.remove('open');
        navToggle.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('nav-open');
      }
    });

    // Close menu when clicking outside (on overlay)
    document.addEventListener('click', function(e) {
      if (!nav.classList.contains('open')) return;
      if (!nav.contains(e.target) && !navToggle.contains(e.target)) {
        nav.classList.remove('open');
        navToggle.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('nav-open');
      }
    });

    // Close menu when clicking a plain nav link (not dropdown toggle)
    if (!window._navLinkCloseHandler) {
      window._navLinkCloseHandler = function(e) {
        if (window.innerWidth > 768) return;
        const nav = document.getElementById('main-nav');
        if (!nav || !nav.classList.contains('open')) return;
        if (e.target.closest('.dropdown-toggle') || e.target.closest('.dropdown-menu')) return;
        const clickedLink = e.target.closest('a');
        if (clickedLink && !clickedLink.classList.contains('dropdown-toggle') && clickedLink.closest('.nav')) {
          nav.classList.remove('open');
          const toggle = document.getElementById('nav-toggle');
          if (toggle) toggle.setAttribute('aria-expanded', 'false');
          document.body.classList.remove('nav-open');
        }
      };
      document.addEventListener('click', window._navLinkCloseHandler, false);
    }
  }

  // Dropdown toggle handler (mobile only)
  if (!window._dropdownToggleHandler) {
    window._dropdownToggleHandler = function(e) {
      if (window.innerWidth > 768) return;
      const nav = document.getElementById('main-nav');
      if (!nav || !nav.classList.contains('open')) return;

      const dropdownToggle = e.target.closest('.dropdown-toggle');
      if (!dropdownToggle) return;
      const dropdown = dropdownToggle.closest('.nav-dropdown');
      if (!dropdown) return;

      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();

      const isActive = dropdown.classList.contains('active');
      nav.querySelectorAll('.nav-dropdown').forEach(d => { if (d !== dropdown) d.classList.remove('active'); });

      if (!isActive) {
        dropdown.classList.add('active');
      } else {
        dropdown.classList.remove('active');
      }

      return false;
    };
  }

  document.removeEventListener('click', window._dropdownToggleHandler, true);
  document.addEventListener('click', window._dropdownToggleHandler, true);

  // Close sidebar when clicking a submenu link on mobile
  window.setupDropdownMenuLinks = function() {
    const navEl = document.getElementById('main-nav');
    if (!navEl) return;
    navEl.querySelectorAll('.dropdown-menu a').forEach(link => {
      const newLink = link.cloneNode(true);
      link.parentNode.replaceChild(newLink, link);
    });
    navEl.querySelectorAll('.dropdown-menu a').forEach(link => {
      link.addEventListener('click', function() {
        if (window.innerWidth <= 768) {
          const nav = document.getElementById('main-nav');
          const toggle = document.getElementById('nav-toggle');
          if (nav) {
            nav.classList.remove('open');
            if (toggle) toggle.setAttribute('aria-expanded', 'false');
            document.body.classList.remove('nav-open');
          }
        }
      });
    });
  };

  setupDropdownMenuLinks();
  window.addEventListener('load', function() { setTimeout(setupDropdownMenuLinks, 100); });

  // Active link highlighting
  const currentPath = window.location.pathname;
  document.querySelectorAll('.nav a[data-page]').forEach(link => {
    const linkPath = new URL(link.href, window.location.origin).pathname;
    if (currentPath.includes(linkPath) ||
        (link.getAttribute('data-page') === 'home' && (currentPath === '/' || currentPath.endsWith('index.html')))) {
      link.classList.add('active');
    }
  });
})();

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof setupDropdownMenuLinks === 'function') setupDropdownMenuLinks();
  });
}
</script>
